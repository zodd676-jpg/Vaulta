<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a10e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaulta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<title>Vaulta</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#100b22;color:#fff;font-family:"Plus Jakarta Sans",Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.95)}
svg{display:block}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:radial-gradient(110% 34% at 6% 2%,rgba(130,92,235,.55) 0,rgba(90,40,240,0) 100%),linear-gradient(180deg,#5211e6 0,#4a0fd0 8%,#3f0fb0 20%,#36178d 31%,#251553 41%,#1b1240 51%,#14102c 60%,#100b22 100%)}
main{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 125px);scrollbar-width:none}
main::-webkit-scrollbar,.sc::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.tr{display:flex;gap:8px}
.gb{width:36px;height:36px;border-radius:50%;background:rgba(88,56,214,.5);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;backdrop-filter:blur(8px)}
.gb svg,.pl svg,.ac svg,.bd svg{fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.gb.l{background:rgba(176,156,255,.45)}
.gb svg{width:18px;height:18px;stroke-width:2.5}
.ring{width:min(63vw,270px);aspect-ratio:1;margin:22px auto 0;border-radius:50%;border:5px solid #9ae6bf;background:linear-gradient(180deg,#3a08ad 0,#2b0697 24%,#1f0a6b 59%,#150c45 90%,#140b3e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 36px rgba(154,230,191,.12),inset 0 0 30px rgba(10,2,60,.35);animation:ri .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes ri{from{opacity:0;transform:scale(.92)}}
.big{display:flex;align-items:baseline;font-weight:800;letter-spacing:-.065em;white-space:nowrap}
.big i{font-style:normal;font-size:.3em;font-weight:700;opacity:.9;margin:0 2px;letter-spacing:0}
.ring .big{font-size:clamp(26px,7.7vw,32px)}
.lb{margin-top:16px;font-weight:700;font-size:13.5px;opacity:.95}
.pills{display:flex;gap:8px;margin:34px 0 10px;overflow-x:auto}
.pl{height:35px;padding:0 14px;border-radius:18px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;flex:none;background:rgba(48,32,98,.7);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pl.on{background:linear-gradient(180deg,#7656e0,#5237b8);border-color:rgba(255,255,255,.3);box-shadow:0 4px 14px rgba(90,50,230,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.pl svg{width:15px;height:15px;stroke-width:2.4}
.card{display:flex;align-items:center;gap:13px;width:100%;height:72px;margin-bottom:6px;padding:0 18px;border-radius:22px;text-align:left;background:linear-gradient(180deg,#201839,#1a1232);border:1px solid rgba(255,255,255,.07);border-top-color:rgba(255,255,255,.17);box-shadow:0 8px 22px rgba(6,0,40,.35);backdrop-filter:blur(10px);animation:fi .45s both}
.card:active{transform:scale(.985)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.card .m{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.pcb{width:16px;height:16px}
.pc{font-size:12px;opacity:.72;font-weight:600;margin-top:3px}
.pc b{font-weight:800;margin-left:6px}.pc .u{color:#8be8a6}
.card .r{text-align:right}.r b{display:block;font-weight:800;font-size:14.5px}.r span{font-size:12px;opacity:.65;font-weight:600}
.tk{font-weight:800;font-size:15px}
.hx{width:32px;height:32px;position:relative;flex:none}.hx svg{width:100%;height:100%}.hx.s22{width:22px;height:22px}
.bd{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:#8b7ec0;display:grid;place-items:center;border:1.5px solid #2c2058}
.bd svg{width:10px;height:10px;stroke-width:3.4}
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);width:min(226px,64%);height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;background:linear-gradient(90deg,#2d1b6b,#1e1248);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 30px rgba(10,0,60,.5),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(16px);z-index:4}
.nav button{width:46px;height:46px;display:grid;place-items:center}.nav svg{width:30px;height:30px}
#sheet{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);background:linear-gradient(180deg,#312747 0,#2e2443 50%,#30264a 100%);border-radius:28px 28px 0 0;overflow:hidden}
#sheet.open{transform:none}
.gr{height:calc(env(safe-area-inset-top) + 38px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;flex:none}
.gr b{width:36px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.3)}
.sc{flex:1;overflow-y:auto;padding:0 18px 150px;scrollbar-width:none}
.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(46,36,67,0),#2e2443 62%);pointer-events:none}
.acs{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;justify-content:center;gap:17px}
.ac{display:flex;flex-direction:column;align-items:center;gap:7px;width:56px;font-size:11.5px;font-weight:700;white-space:nowrap}
.ac i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(160,140,230,.2);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ac.on i{background:linear-gradient(180deg,#7452f5,#4a2acd);border-color:rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(90,50,230,.55)}
.ac svg{width:21px;height:21px;stroke-width:2.7}
.dh{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.dn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;opacity:.85}
.dh .big{font-size:52px;margin-top:6px}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:13px;height:28px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);font-weight:800;font-size:13px}
.live u{width:8px;height:8px;border-radius:50%;background:#8be8a6;animation:pu 1.6s infinite}
@keyframes pu{50%{opacity:.35;transform:scale(.8)}}
.ch{position:relative;margin:20px -18px 0;aspect-ratio:360/176}.ch svg{width:100%;height:100%;overflow:visible}
.cl{position:absolute;left:14px;font-size:11px;font-weight:600;opacity:.6;transform:translateY(-50%)}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .15s ease-out forwards;filter:drop-shadow(0 0 3px rgba(143,108,255,.55))}
@keyframes dr{to{stroke-dashoffset:0}}
.ar{animation:fi .9s both}
.hold{display:flex;margin-top:20px;padding:26px 8px 20px;border-radius:22px;background:radial-gradient(90% 120% at 10% 100%,rgba(120,70,230,.7),rgba(60,30,130,.1) 70%),rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-top-color:rgba(160,130,255,.5);border-bottom-color:rgba(130,90,255,.6)}
.hold>div{flex:1;text-align:center}.hold>div+div{border-left:1px solid rgba(255,255,255,.1)}
.hold b{display:block;font-weight:800;font-size:26px;letter-spacing:-.03em}.hold .g{color:#9ff0c0}
.hold .big{font-size:25px;justify-content:center}
.hold span{display:block;margin-top:8px;font-weight:700;font-size:14px}
.dt{font-weight:800;font-size:13px;margin:26px 0 4px}
.tx{display:flex;align-items:flex-start;gap:12px;padding:8px 0 12px;position:relative}
.tx::after{content:"";position:absolute;left:44px;right:0;bottom:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.04))}
.tx .hx{width:30px;height:30px}.tx .bd{width:14px;height:14px;right:-5px;bottom:-4px}.tx .bd svg{width:8px;height:8px}
.tm b{display:block;font-weight:800;font-size:14px}.tm span{display:block;margin-top:2px;opacity:.65;font-size:13px;font-weight:600}
.tv{margin-left:auto;font-weight:800;font-size:14.5px;padding-top:1px}
.emp{text-align:center;opacity:.55;padding:40px 0;font-weight:600}
h2.sh{font-size:24px;margin:6px 0 10px}
.sc label{display:block;margin:14px 0 6px;font-size:13px;opacity:.7;font-weight:600}
.sc input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;color:#fff;padding:13px;font:600 16px "Plus Jakarta Sans",sans-serif}
.sc input:focus{outline:2px solid #7452f5;border-color:transparent}
.sb{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:4px 14px 14px;margin-top:14px}
.sn{display:flex;align-items:center;gap:10px;font-weight:700;padding-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{width:100%;margin-top:14px;padding:15px;border-radius:16px;background:linear-gradient(180deg,#7452f5,#4b2bd3);font-weight:800;font-size:16px}.bt.s{background:rgba(255,255,255,.08)}
.dc{font-size:12px;opacity:.6;text-align:center;margin:18px 0 0}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(20,10,70,.92);border:1px solid rgba(255,255,255,.18);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.ln{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <div class="nav">
    <button onclick="shut()" aria-label="Wallet"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="14" rx="3.4" fill="#6c3ff7"/><path d="M3 9.5h18" stroke="#9a7bff" stroke-width="1.2" fill="none"/><circle cx="16.8" cy="14.6" r="1.3" fill="#fff"/></svg></button>
    <button onclick="toast('Swap is a demo')" aria-label="Swap"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"><path d="M5 8.5h13.5l-3.6-3.6" stroke="#fff"/><path d="M19 15.5H5.5l3.6 3.6" stroke="#b9a8f2"/></svg></button>
    <button onclick="toast('Buy / Sell is a demo')" aria-label="Buy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#e4d2f2"/><text x="12" y="16.4" text-anchor="middle" font-size="13" font-weight="800" fill="#c79bd0" font-family="Arial">$</text></svg></button>
  </div>
  <div id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const DEF={brand:"Vaulta",label:"Crypto",tokens:[
{s:"SOL",n:"Solana",a:653149.008,p:120.330000018,ch:-0.1,pc:1},
{s:"BTC",n:"Bitcoin",a:0,p:86216,ch:0.4},
{s:"ETH",n:"Ethereum",a:0,p:2713.93,ch:0.1,pc:1},
{s:"USDT",n:"Tether USD",a:0,p:0.9999,ch:0},
{s:"USDC",n:"USD Coin",a:0,p:1,ch:0}]};
let st;try{st=JSON.parse(localStorage.getItem("vaulta2"))}catch(e){}
if(!st||!st.tokens)st=JSON.parse(JSON.stringify(DEF));
const sv=()=>{try{localStorage.setItem("vaulta2",JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id),N=(n,a,b)=>n.toLocaleString("en-US",{minimumFractionDigits:a,maximumFractionDigits:b});
const money=n=>"$"+N(n,2,2),pd=p=>p>=10?2:4,tot=()=>st.tokens.reduce((s,t)=>s+t.a*t.p,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const P={buy:'<path d="M12 4v9M8 9.5l4 4 4-4M6 19h12"/>',rec:'<path d="M17 7 7 17M7 9.5V17h7.5"/>',snd:'<path d="M7 17 17 7M9.5 7H17v7.5"/>',sel:'<path d="M12 14V5M8 8.5l4-4 4 4M6 19h12"/>',usd:'<path d="M12 3.5v17M16 8.2c-.7-1.3-2-1.9-4-1.9-2.4 0-3.8 1.1-3.8 2.8 0 3.6 8 1.6 8 5.4 0 1.8-1.7 3-4.2 3-2 0-3.4-.7-4.2-2"/>',swp:'<path d="M5 8.5h13.5l-3.5-3.5M19 15.5H5.5L9 19"/>',hi:'<path d="M3.6 12a8.4 8.4 0 1 0 2.5-6L3.6 8.4M3.6 3.9v4.5H8M12 7.6V12l3 2"/>'};
const HC={SOL:"#0d0a18",BTC:"#f3a13c",ETH:"#7d72cf",USDT:"#52c1b7",USDC:"#3b5fd0"};
const tx=(c,x)=>`<text x="12" y="16" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Arial">${x}</text>`;
const HG={SOL:'<path d="M7.8 8.2h9.2l-1.7 1.8H6.1z" fill="#2ee6a8"/><path d="M6.1 11.1h9.2l1.7 1.8H7.8z" fill="#6f86f2"/><path d="M7.8 14h9.2l-1.7 1.8H6.1z" fill="#a35cf0"/>',BTC:tx(0,"B"),ETH:'<path d="M12 6.2 8 12.4l4 2.3 4-2.3zM12 15.6l-4-2.3 4 5.3 4-5.3z" fill="#fff" opacity=".92"/>',USDT:'<path d="M7.8 8h8.4v1.8h-3.3V11c2 .1 3.4.5 3.4 1s-1.4.9-3.4 1v3.6h-1.8V13c-2-.1-3.4-.5-3.4-1s1.4-.9 3.4-1V9.8H7.8z" fill="#fff"/>',USDC:'<circle cx="12" cy="12" r="5" fill="none" stroke="#fff" stroke-width="1.4"/><text x="12" y="15" text-anchor="middle" font-size="7.5" font-weight="800" fill="#fff" font-family="Arial">$</text>'};
const HX='<path d="M12 1.8 21 6.9v10.2L12 22.2 3 17.1V6.9z"';
const ic=t=>{const c=HC[t.s]||"#6a5acd";return `<svg viewBox="0 0 24 24">${HX} fill="${c}" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/>${HG[t.s]||tx(0,esc(t.s[0]))}</svg>`};
const pcb=`<svg class="pcb" viewBox="0 0 24 24">${HX} fill="#8a80b8"/>${tx(0,"%")}</svg>`;
function bigN(n,d){const [i,f]=n.toFixed(d).split(".");return `<span class="big"><i>$</i>${N(+i,0,0)}<i>.${f}</i></span>`}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hs(x){let h=0;for(const c of x)h=(h*31+c.charCodeAt(0))|0;return h}
function bez(p){let d="M"+p[0][0]+" "+p[0][1];for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=" C"+(b[0]+(c[0]-a[0])/6).toFixed(1)+" "+(b[1]+(c[1]-a[1])/6).toFixed(1)+","+(c[0]-(e[0]-b[0])/6).toFixed(1)+" "+(c[1]-(e[1]-b[1])/6).toFixed(1)+","+c[0].toFixed(1)+" "+c[1].toFixed(1)}return d}
const SOLC=[[10,102.8],[28.2,100.5],[55.5,82.3],[78.2,88.2],[105.5,70.9],[132.7,43.6],[156.4,23.6],[171.4,29.9],[187.3,70.9],[205.5,98.3],[232.7,130.1],[250.9,152],[269,148.3],[282.7,134.7],[300.9,93.7],[310,82.3],[325.9,70.9],[337.3,82.3],[350,92.8]];
function chart(t){let p;if(t.s==="SOL")p=SOLC;else{const r=rng(hs(t.s)),n=48;let v=[],x=.4;for(let i=0;i<n;i++){x+=(r()-.5)*.36;v.push(x)}
for(let k=0;k<2;k++)v=v.map((a,i)=>(i>0?v[i-1]:a)*.25+a*.5+(i<n-1?v[i+1]:a)*.25);
const mn=Math.min(...v),mx=Math.max(...v);v=v.map(a=>(a-mn)/((mx-mn)||1));
for(let i=n-9;i<n;i++){const q=(i-(n-9))/8*.8;v[i]=v[i]*(1-q)+.5*q}
p=v.map((a,i)=>[+(i/(n-1)*340+10).toFixed(1),+(150-a*128).toFixed(1)])}
const d=bez(p),e=p[p.length-1],f=y=>"$"+N(y,2,pd(t.p));
return `<div class="ch"><svg viewBox="0 0 360 176"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3283" stop-opacity=".95"/><stop offset="1" stop-color="#33234f" stop-opacity=".9"/></linearGradient></defs><path d="M58 14H352M58 162H352" stroke="rgba(255,255,255,.14)" fill="none"/><path class="ar" d="${d}L${e[0]} 162L${p[0][0]} 162Z" fill="url(#ag)"/><path class="ln" pathLength="1" d="${d}" fill="none" stroke="#8f6cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="8" fill="rgba(190,170,255,.3)"/><circle cx="${e[0]}" cy="${e[1]}" r="3.8" fill="#d6caff"/></svg><span class="cl" style="top:8%">${f(t.p*1.0012)}</span><span class="cl" style="top:92%">${f(t.p*.9987)}</span></div>`}
function txs(t){if(!(t.a>0))return[];const r=rng(hs(t.s)+7),k=6,w=[];let sm=0;for(let i=0;i<k;i++){w.push(.3+r());sm+=w[i]}
const u=t.a>=1000?1:t.a>=10?.01:.0001,d0=new Date();d0.setHours(0,0,0,0);let rest=t.a,day=1+Math.floor(r()*3);const o=[],tm=()=>Math.floor((8+r()*13)*60)*6e4;
for(let i=0;i<k;i++){let a=i===k-1?rest:Math.floor(t.a*w[i]/sm/u)*u;a=Math.round(a*1e4)/1e4;rest=Math.max(0,rest-a);day+=1+Math.floor(r()*9);o.push({amt:a,ts:d0.getTime()-day*864e5+tm()})}
o.push({amt:Math.floor(t.a*.07/u)*u,out:1,ts:d0.getTime()-Math.max(1,day-4)*864e5+tm()});return o.sort((a,b)=>b.ts-a.ts)}
const dl=ts=>new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"}),tl=ts=>new Date(ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
const trow=(x,t)=>`<div class="tx"><div class="hx">${ic(t)}<span class="bd">${S(x.out?P.snd:P.rec)}</span></div><div class="tm"><b>${N(x.amt,0,4)} ${t.s}</b><span>${tl(x.ts)}</span></div><div class="tv">${x.out?"":"+"}${money(x.amt*t.p)}</div></div>`;
function groups(list){let h="",last="";list.forEach(o=>{const k=dl(o.x.ts);if(k!==last){h+=`<div class="dt">${k}</div>`;last=k}h+=trow(o.x,o.t)});return h||'<div class="emp">No transactions yet</div>'}
const card=(t,i)=>{const v=t.a*t.p,c=t.ch,cs=Math.abs(c)<.05?"":`<b class="${c>0?"u":""}">${c>0?"+":"-"}${Math.abs(c).toFixed(1)}%</b>`;
return `<button class="card" style="animation-delay:${i*60}ms" onclick="openT('${t.s}')"><div class="hx">${ic(t)}</div><div class="m"><div class="nm">${t.n}${t.pc?pcb:""}</div><div class="pc">$${N(t.p,2,pd(t.p))}${cs}</div></div>${t.a>0?`<div class="r"><b>${N(t.a,0,3)} ${t.s}</b><span>${money(v)}</span></div>`:`<div class="tk">${t.s}</div>`}</button>`};
function render(){const L=st.tokens.slice().sort((a,b)=>b.a*b.p-a.a*a.p),T=tot(),soon=m=>`onclick="toast('${m} is a demo')"`;
document.title=st.brand;
$("main").innerHTML=`<div class="top"><button class="gb l" onclick="openS()" aria-label="Settings">${S('<path d="M12 3.8 20.2 12 12 20.2 3.8 12z"/><path d="M12 8.6 15.4 12 12 15.4 8.6 12z" fill="#fff" stroke="none"/>')}</button><div class="tr"><button class="gb" ${soon("Search")}>${S('<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>')}</button><button class="gb" onclick="openH()" aria-label="History">${S(P.hi)}</button></div></div><div class="ring">${bigN(T,2)}<div class="lb">${esc(st.label)}</div></div><div class="pills"><button class="pl on" ${soon("Buy")}>${S(P.buy)}Buy</button><button class="pl" ${soon("Receive")}>${S(P.rec)}Receive</button><button class="pl" ${soon("Send")}>${S(P.snd)}Send</button><button class="pl" ${soon("Sell")}>${S(P.sel)}Sell</button></div>${L.map(card).join("")}`}
const sh=$("sheet");
function sheet(h,fx){sh.innerHTML=`<div class="gr" onclick="shut()"><b></b></div><div class="sc" ${fx?"":'style="padding-bottom:40px"'}>${h}</div>${fx||""}`;sh.className="open"}
function shut(){sh.className=""}
let ty=null;sh.addEventListener("touchstart",e=>{ty=e.target.closest(".gr")?e.touches[0].clientY:null});sh.addEventListener("touchend",e=>{if(ty!==null&&e.changedTouches[0].clientY-ty>50)shut();ty=null});
const FX=`<div class="fade"></div><div class="acs"><button class="ac on" onclick="toast('Buy / Sell is a demo')"><i>${S(P.usd)}</i>Buy / Sell</button><button class="ac" onclick="toast('Swap is a demo')"><i>${S(P.swp)}</i>Swap</button><button class="ac" onclick="toast('Send is a demo')"><i>${S(P.snd)}</i>Send</button><button class="ac" onclick="toast('Receive is a demo')"><i>${S(P.rec)}</i>Receive</button></div>`;
function openT(s){const t=st.tokens.find(x=>x.s===s);sheet(`<div class="dh"><div class="dn"><span class="hx s22">${ic(t)}</span>${t.n}</div>${bigN(t.p,pd(t.p))}<div class="live"><u></u>LIVE</div></div>${chart(t)}<div class="hold"><div><b class="g">${N(t.a,0,3)}</b><span>${t.s}</span></div><div>${bigN(t.a*t.p,2)}<span>Value</span></div></div>${groups(txs(t).map(x=>({x,t})))}`,FX);$("sheet").querySelector(".sc").scrollTop=0}
function openH(){const a=[];st.tokens.forEach(t=>txs(t).forEach(x=>a.push({x,t})));a.sort((p,q)=>q.x.ts-p.x.ts);sheet(groups(a),FX)}
function openS(){const T=tot();sheet(`<h2 class="sh">Настройки</h2><label>Название приложения</label><input id="br" value="${esc(st.brand)}"><label>Подпись под балансом</label><input id="lb" value="${esc(st.label)}"><label>Общий баланс, $</label><input id="tb" inputmode="decimal" data-o="${T.toFixed(2)}" value="${T.toFixed(2)}">`+st.tokens.map((t,i)=>`<div class="sb"><div class="sn"><span class="hx s22">${ic(t)}</span>${t.n}</div><div class="g2"><div><label>Количество</label><input inputmode="decimal" data-i="${i}" data-k="a" value="${t.a}"></div><div><label>Цена, $</label><input inputmode="decimal" data-i="${i}" data-k="p" value="${t.p}"></div></div><label>Изменение за 24ч, %</label><input inputmode="decimal" data-i="${i}" data-k="ch" value="${t.ch}"></div>`).join("")+`<button class="bt" onclick="apply()">Сохранить</button><button class="bt s" onclick="reset()">Сбросить всё</button><p class="dc">Демонстрационное приложение. Баланс вымышленный и не связан с реальными средствами.</p>`)}
const pn=v=>parseFloat(String(v).replace(/\s/g,"").replace(",","."));
function apply(){st.brand=$("br").value.trim()||DEF.brand;st.label=$("lb").value.trim()||DEF.label;
document.querySelectorAll("[data-i]").forEach(e=>{const t=st.tokens[e.dataset.i],k=e.dataset.k,v=pn(e.value);t[k]=k==="ch"?(isFinite(v)?v:0):(isFinite(v)&&v>=0?v:0)});
const nt=pn($("tb").value),o=pn($("tb").dataset.o);
if(isFinite(nt)&&nt>=0&&Math.abs(nt-o)>.005){const c=tot();if(c>0){const k=nt/c;st.tokens.forEach(t=>t.a=t.a*k)}else st.tokens[0].a=nt/(st.tokens[0].p||1)}
sv();shut();render();toast("Сохранено")}
function reset(){if(confirm("Сбросить все значения?")){st=JSON.parse(JSON.stringify(DEF));sv();shut();render()}}
function toast(m){const t=$("toast");t.textContent=m;t.className="toast on";setTimeout(()=>t.className="toast",1600)}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
